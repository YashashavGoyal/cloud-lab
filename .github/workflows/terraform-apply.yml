name: "Terraform Apply"

on:
  push:
    branches: [ "main" ]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to apply"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      auto_approve:
        description: "Auto-approve apply step"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apply-dev:
    name: "Apply Development Stack"
    if: github.event_name == 'push' || inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/dev

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve
        working-directory: infra/environments/dev

  apply-staging:
    name: "Apply Staging Stack"
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/staging

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve
        working-directory: infra/environments/staging

  apply-prod:
    name: "Apply Production Stack"
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/prod

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve
        working-directory: infra/environments/prod
