name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to apply"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  apply-dev:
    name: "Apply Development Stack"
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
      (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref, '-dev') || !contains(github.ref, '-')))
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/dev

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve
        working-directory: infra/environments/dev

  apply-staging:
    name: "Apply Staging Stack"
    needs: [apply-dev]
    if: |
      always() &&
      !cancelled() &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
        (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref, '-stage') || contains(github.ref, '-rc'))) ||
        (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && needs.apply-dev.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/staging

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve
        working-directory: infra/environments/staging

  apply-prod:
    name: "Apply Production Stack"
    needs: [apply-staging]
    if: |
      always() &&
      !cancelled() &&
      (needs.apply-staging.result == 'success' || needs.apply-staging.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') ||
        (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && needs.apply-staging.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/prod

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve
        working-directory: infra/environments/prod
