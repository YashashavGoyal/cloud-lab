name: "Terraform Plan"

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Initialize Environment Stack
        run: terraform init
        working-directory: infra/environments/${{ matrix.environment }}

      - name: Generate Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          echo "PLAN_OUTPUT<<EOF" >> $GITHUB_ENV
          terraform show -no-color tfplan >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        working-directory: infra/environments/${{ matrix.environment }}

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ github.token }}
          script: |
            const rawPlan = process.env.PLAN_OUTPUT || 'Execution plan generated.';
            const truncatedPlan = rawPlan.length > 6000 ? rawPlan.substring(0, 6000) + '\n... (truncated output)' : rawPlan;

            const output = `#### Terraform Plan: \`${{ matrix.environment }}\` Status: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
